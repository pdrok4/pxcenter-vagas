name: Scrape PX Center Vagas

on:
  schedule:
    - cron: '0 17 * * *'  # 9h no horário de Brasília
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 feedgen playwright
      - run: playwright install --with-deps chromium
      - run: python scraper.py
      - run: python json_to_rss.py
      - name: Commit changes
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add vagas.json feed.xml
          git diff --staged --quiet || (git commit -m "Update vagas" && git push)
